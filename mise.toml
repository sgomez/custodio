# Development tools, pinned so every machine runs the same versions. One-time setup: `just setup`
# (it runs `mise install`). Rust itself comes from rustup and rust-toolchain.toml.
[tools]
node = "22"
just = "1.59.0"
lefthook = "2.2.2"
taplo = "0.10.0"
zizmor = "1.31.1"
shellcheck = "0.11.0"
actionlint = "1.7.12"
git-cliff = "2.14.2"
cargo-binstall = "1.26.1"
cargo-deny = "0.20.2"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-deb" = "3.8.0"
