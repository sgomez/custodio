# The one file list of the .deb, the .rpm and the Arch package (`just package`; run from the repository root).
# Every installed file is listed once, under /usr. Per-format overrides hold only metadata, dependency names and
# the lifecycle script files. The version comes from the environment (see the `package` recipe).
name: custodio
arch: amd64
platform: linux
version: ${NFPM_VERSION}
prerelease: ${NFPM_PRERELEASE}
release: "1"
section: utils
priority: optional
maintainer: rFirma <info@rfirma.com>
vendor: rFirma
homepage: https://github.com/rfirma/custodio
license: EUPL-1.2
description: |
  Signing service for PKCS#12 keys
  The service keeps PKCS#12 keys and asks polkit before every signature.
  It comes with a command-line importer and a PKCS#11 module for p11-kit,
  so that PKCS#11 applications can sign without ever holding the key.
rpm:
  group: System Environment/Daemons
# The bound 257 is the first systemd with the user-scoped credential calls over Varlink that custodiod uses (docs/findings/F110.md);
# Ubuntu 24.04 ships 255 and is no longer installable. The .rpm and the Arch package carry the same bound.
# systemd is a Pre-Depends, not a Depends: preinst runs systemd-sysusers, and dpkg guarantees Depends only for postinst (docs/decisions.md).
deb:
  predepends:
    - systemd (>= 257)

contents:
  # The service binary where each distribution wants it (F61, docs/decisions.md): /usr/libexec in the .deb and the .rpm, /usr/lib in the Arch
  # package (Arch has no /usr/libexec). The unit of each format comes from the one source data/custodio.service (scripts/derive-units.sh).
  - src: target/release/custodiod
    dst: /usr/libexec/custodio/custodiod
    packager: deb
    file_info: {mode: 0755, owner: root, group: root}
  - src: target/release/custodiod
    dst: /usr/libexec/custodio/custodiod
    packager: rpm
    file_info: {mode: 0755, owner: root, group: root}
  - src: target/release/custodiod
    dst: /usr/lib/custodio/custodiod
    packager: archlinux
    file_info: {mode: 0755, owner: root, group: root}
  - src: target/release/custodio-cli
    dst: /usr/bin/custodio
    file_info: {mode: 0755, owner: root, group: root}
  - src: target/release/libcustodio_pkcs11.so
    dst: /usr/lib/custodio/libcustodio_pkcs11.so
    file_info: {mode: 0644, owner: root, group: root}
  - src: target/units/deb/custodio.service
    dst: /usr/lib/systemd/system/custodio.service
    packager: deb
    file_info: {mode: 0644, owner: root, group: root}
  - src: target/units/rpm/custodio.service
    dst: /usr/lib/systemd/system/custodio.service
    packager: rpm
    file_info: {mode: 0644, owner: root, group: root}
  - src: target/units/archlinux/custodio.service
    dst: /usr/lib/systemd/system/custodio.service
    packager: archlinux
    file_info: {mode: 0644, owner: root, group: root}
  - src: data/sysusers.d/custodio.conf
    dst: /usr/lib/sysusers.d/custodio.conf
    file_info: {mode: 0644, owner: root, group: root}
  - src: data/tmpfiles.d/custodio.conf
    dst: /usr/lib/tmpfiles.d/custodio.conf
    file_info: {mode: 0644, owner: root, group: root}
  - src: data/com.rfirma.Custodio1.conf
    dst: /usr/share/dbus-1/system.d/com.rfirma.Custodio1.conf
    file_info: {mode: 0644, owner: root, group: root}
  - src: data/com.rfirma.Custodio1.service
    dst: /usr/share/dbus-1/system-services/com.rfirma.Custodio1.service
    file_info: {mode: 0644, owner: root, group: root}
  - src: data/com.rfirma.custodio.policy
    dst: /usr/share/polkit-1/actions/com.rfirma.custodio.policy
    file_info: {mode: 0644, owner: root, group: root}
  - src: data/custodio.module
    dst: /usr/share/p11-kit/modules/custodio.module
    file_info: {mode: 0644, owner: root, group: root}
  - src: data/custodio.catalog
    dst: /usr/lib/systemd/catalog/custodio.catalog
    file_info: {mode: 0644, owner: root, group: root}
  - src: LICENSE
    dst: /usr/share/licenses/custodio/LICENSE
    file_info: {mode: 0644, owner: root, group: root}
  # rpm owns no directory it is not told about, so `dnf remove` would leave these three behind (found by the removal case of the e2e suite,
  # F49). dpkg and pacman own the parents of the files they list; for them these entries would add nothing.
  - dst: /usr/lib/custodio
    type: dir
    packager: rpm
    file_info: {mode: 0755, owner: root, group: root}
  - dst: /usr/libexec/custodio
    type: dir
    packager: rpm
    file_info: {mode: 0755, owner: root, group: root}
  - dst: /usr/share/doc/custodio
    type: dir
    packager: rpm
    file_info: {mode: 0755, owner: root, group: root}
  - dst: /usr/share/licenses/custodio
    type: dir
    packager: rpm
    file_info: {mode: 0755, owner: root, group: root}
  - src: packaging/arch/custodio-bus-check.hook
    dst: /usr/share/libalpm/hooks/custodio-bus-check.hook
    packager: archlinux
    file_info: {mode: 0644, owner: root, group: root}
  - src: packaging/arch/custodio-bus-check
    dst: /usr/share/libalpm/scripts/custodio-bus-check
    packager: archlinux
    file_info: {mode: 0755, owner: root, group: root}
  - src: packaging/arch/zz-custodio-restart.hook
    dst: /usr/share/libalpm/hooks/zz-custodio-restart.hook
    packager: archlinux
    file_info: {mode: 0644, owner: root, group: root}
  - src: packaging/copyright
    dst: /usr/share/doc/custodio/copyright
    file_info: {mode: 0644, owner: root, group: root}
  - src: target/doc/changelog.Debian.gz
    dst: /usr/share/doc/custodio/changelog.Debian.gz
    file_info: {mode: 0644, owner: root, group: root}
  - src: target/man/custodio.1.gz
    dst: /usr/share/man/man1/custodio.1.gz
    file_info: {mode: 0644, owner: root, group: root}

# nfpm does not compute shared-library dependencies: libc and libgcc_s are what `readelf -d` shows on the binaries.
overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - polkitd (>= 124)
      - dbus-system-bus
      - p11-kit
      # TPM2 Software Stack (F125): the three linked libraries, the TCTI that libtss2-tctildr loads by dlopen, and tpm-udev, which creates
      # the `tss` group the unit names (SupplementaryGroups=tss). The same t64 names on debian13 and ubuntu2604.
      - libtss2-esys-3.0.2-0t64
      - libtss2-tctildr0t64
      - libtss2-mu-4.0.1-0t64
      - libtss2-tcti-device0t64
      # systemd loads libtss2-rc by dlopen when it seals credentials to the TPM, and Ubuntu only Recommends it (systemd-creds then fails
      # on a host installed without recommends), so the .deb depends on it. The .rpm and Arch tpm2-tss ship every libtss2 library.
      - libtss2-rc0t64
      - tpm-udev
      # No util-linux (setpriv, F89) here: it is Essential on Debian and Ubuntu, and a dependency on an Essential package is a lintian
      # finding. pkttyagent comes with polkitd above.
    scripts:
      preinstall: packaging/deb/preinst
      postinstall: packaging/deb/postinst
      preremove: packaging/deb/prerm
      postremove: packaging/deb/postrm
  rpm:
    depends:
      - glibc
      - libgcc
      - polkit >= 124
      - systemd >= 257 # user-scoped systemd-creds Varlink calls (F110: alma10 257, fedora44 259)
      - dbus
      - p11-kit
      - tpm2-tss # libtss2-esys, -tctildr, -mu and the tcti-device; creates the `tss` group the unit names (F109, F125)
      - util-linux # setpriv for the pkttyagent helper (F89); pkttyagent comes with polkit above
    scripts:
      preinstall: packaging/rpm/pre
      postinstall: packaging/rpm/post
      preremove: packaging/rpm/preun
      postremove: packaging/rpm/postun
  archlinux:
    depends:
      - glibc
      - gcc-libs
      - polkit>=124
      - systemd>=257 # user-scoped systemd-creds Varlink calls (F110: arch decided as ubuntu2604)
      - dbus
      - p11-kit
      - tpm2-tss # libtss2-esys, -tctildr, -mu and the tcti-device; creates the `tss` group the unit names (F109, F125)
      - util-linux # setpriv for the pkttyagent helper (F89); pkttyagent comes with polkit above
    scripts:
      preinstall: packaging/arch/pre_install
      postinstall: packaging/arch/post_install
      preremove: packaging/arch/pre_remove
      postremove: packaging/arch/post_remove
    archlinux:
      scripts:
        preupgrade: packaging/arch/pre_upgrade
        postupgrade: packaging/arch/post_upgrade
