# Commit message format and fast checks on commit, slow ones on push. Install with `npm ci && lefthook install`.
pre-commit:
  commands:
    check:
      run: just check

pre-push:
  commands:
    check-slow:
      run: just check-slow

commit-msg:
  commands:
    conventional:
      run: npx --no-install commitlint --edit {1}
