# Commit message format and formatting lints of what is staged; `just quick`, `just check` and CI run the rest. Install with `just setup`.
pre-commit:
  commands:
    rust:
      glob: "*.rs"
      run: cargo fmt --all --check
    toml:
      glob: "*.toml"
      run: taplo fmt --check {staged_files}
    shell:
      glob: "*.sh"
      run: shellcheck -x {staged_files}
    harness:
      glob: "harness/*.sh"
      run: scripts/check-files.sh

commit-msg:
  commands:
    conventional:
      run: npx --no-install commitlint --edit {1}
