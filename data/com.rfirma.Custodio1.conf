<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the user `custodio` (the name systemd gives the DynamicUser= of custodio.service) may own the name. Clients are any user:
       every signature is authorized by polkit, not by this policy. -->
  <policy context="default">
    <deny own="com.rfirma.Custodio1"/>
    <allow send_destination="com.rfirma.Custodio1"/>
  </policy>
  <policy user="custodio">
    <allow own="com.rfirma.Custodio1"/>
  </policy>
</busconfig>
