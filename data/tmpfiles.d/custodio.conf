# Gives the files of the state directory their default SELinux label back (F61, docs/findings.md "F61"). A service that ran in init_t
# (the binary under /usr/lib/custodio, lib_t, before the move to /usr/libexec) wrote its key files as init_var_lib_t. systemd-tmpfiles runs
# this at every boot (systemd-tmpfiles-setup.service), also on an image-based system where rpm-ostree layers the package and no scriptlet
# touches /var at deploy time. Type Z restores the label of the directory and what is below it; the three dashes leave mode, owner
# and group as they are. The line does nothing when the directory does not exist (it never creates it), when SELinux is off,
# or when systemd-tmpfiles is not there. The path is the real directory of StateDirectory=custodio with DynamicUser=yes; Z does not follow
# the symlink /var/lib/custodio.
Z /var/lib/private/custodio - - -
