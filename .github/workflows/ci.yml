name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A newer push cancels the older run, on main too: the newest commit contains the older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  commits:
    name: conventional commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: npm ci --no-audit --no-fund
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch (all-zero `before`) or a force push leaves no usable base: check the pushed commit.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            npx --no-install commitlint --from "$BASE" --to "$HEAD" --verbose
          else
            git log -1 --format=%B "$HEAD" | npx --no-install commitlint --verbose
          fi

  lint:
    name: just lint
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: ${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          # PR caches would evict main's, and main's are the ones every branch restores.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.59.0,taplo@0.10.0,typos@1.51.1,zizmor@1.31.1,shellcheck@0.11.0,cargo-deny@0.20.2,cargo-machete@0.9.2
      # install-action does not ship actionlint; pinned release, checksum-verified.
      - run: |
          curl -sSfLo /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C "$HOME/.cargo/bin" actionlint
      # The rest of `just check`; `just test` is its own job.
      - run: just lint system-gates

  test:
    name: just test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: ${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.59.0
      - run: just test

  # Unit and integration tests under llvm-cov, then the CRAP gate.
  coverage:
    name: just coverage-gate
    # Slow: main only; a PR runs the fast jobs.
    if: github.event_name == 'push'
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: ${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.59.0,cargo-llvm-cov@0.9.1
      - run: rustup component add llvm-tools-preview
      - run: just coverage-gate

  nightly:
    name: just nightly
    # Slow: main only; a PR runs the fast jobs.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.59.0,cargo-fuzz@0.13.2
      - id: toolchain
        run: |
          toolchain=$(just --evaluate nightly_toolchain)
          rustup toolchain install "$toolchain" --profile minimal --component miri --component rust-src
          echo "nightly=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The pinned nightly and our own hash replace rust-cache's, which lists every toolchain on the runner image.
          shared-key: nightly-${{ steps.toolchain.outputs.nightly }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          add-rust-environment-hash-key: false
          workspaces: |
            . -> target
            crates/custodio-pkcs11/fuzz -> target
            crates/custodiod/fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just nightly

  # Only the mutants on lines this push or PR changes; mutants.yml sweeps them all every week.
  mutants:
    name: just mutants (diff)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The test job's cache holds the same test build; saving one here would freeze whatever the first diff compiled.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: test-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          save-if: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.59.0,cargo-mutants@27.1.0
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch (all-zero `before`) or a force push leaves no usable base: diff the last commit.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            base=$(git merge-base "$BASE" HEAD)
          else
            base=HEAD^
          fi
          git diff "$base" HEAD > "$RUNNER_TEMP/changes.diff"
          just mutants --in-place --in-diff "$RUNNER_TEMP/changes.diff"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-diff
          path: target/mutants/mutants.out/*.txt

  # Single required status check for branch protection: it fails if any job above did not succeed.
  ci:
    name: ci
    if: always()
    needs: [commits, lint, test, coverage, nightly, mutants]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # `skipped` is a main-only job on a PR.
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "job result: $r"; exit 1 ;; esac
          done
