name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A newer push cancels the older run, on main too: the newest commit contains the older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  commits:
    name: conventional commits
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: npm ci --no-audit --no-fund
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch (all-zero `before`) or a force push leaves no usable base: check the pushed commit.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            npx --no-install commitlint --from "$BASE" --to "$HEAD" --verbose
          else
            git log -1 --format=%B "$HEAD" | npx --no-install commitlint --verbose
          fi

  lint:
    name: just lint
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tss-esapi builds against the TSS2 headers (libtss2-dev); tests and tools use a software TPM (swtpm, tpm2-tools).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: ${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          # PR caches would evict main's, and main's are the ones every branch restores.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.59.0,taplo@0.10.0,zizmor@1.31.1,shellcheck@0.11.0,cargo-deny@0.20.2,cargo-machete@0.9.2
      # install-action does not ship actionlint; pinned release, checksum-verified.
      - run: |
          curl -sSfLo /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C "$HOME/.cargo/bin" actionlint
      # The rest of `just check` (it needs the nfpm tools above); `just test` is its own job.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm libarchive-tools zstd python3-yaml
      - run: |
          curl -sSfLo /tmp/nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  /tmp/nfpm.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - run: just lint system-gates package-gate-test shell-scripts-test

  test:
    name: just test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tss-esapi builds against the TSS2 headers (libtss2-dev); tests and tools use a software TPM (swtpm, tpm2-tools).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev
      # The creds tests run systemd-creds under `unshare --map-root-user`; Ubuntu's AppArmor refuses that by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: ${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.59.0
      - run: just test

  # Unit and integration tests under llvm-cov, then the CRAP gate.
  coverage:
    name: just coverage-gate
    # Slow: main only; a PR runs the fast jobs.
    if: github.event_name == 'push'
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tss-esapi builds against the TSS2 headers (libtss2-dev); tests and tools use a software TPM (swtpm, tpm2-tools).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev
      # The creds tests run systemd-creds under `unshare --map-root-user`; Ubuntu's AppArmor refuses that by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: ${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.59.0,cargo-llvm-cov@0.9.1
      - run: rustup component add llvm-tools-preview
      - run: just coverage-gate

  nightly:
    name: just nightly
    # Slow: main only; a PR runs the fast jobs.
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tss-esapi builds against the TSS2 headers (libtss2-dev); tests and tools use a software TPM (swtpm, tpm2-tools).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.59.0,cargo-fuzz@0.13.2
      - id: toolchain
        run: |
          toolchain=$(just --evaluate nightly_toolchain)
          rustup toolchain install "$toolchain" --profile minimal --component miri --component rust-src
          echo "nightly=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The pinned nightly and our own hash replace rust-cache's, which lists every toolchain on the runner image.
          shared-key: nightly-${{ steps.toolchain.outputs.nightly }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          add-rust-environment-hash-key: false
          workspaces: |
            . -> target
            crates/custodio-pkcs11/fuzz -> target
            crates/custodiod/fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just nightly

  # Only the mutants on lines this push or PR changes; mutants.yml sweeps them all every week.
  mutants:
    name: just mutants (diff)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # tss-esapi builds against the TSS2 headers (libtss2-dev); tests and tools use a software TPM (swtpm, tpm2-tools).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev
      # The creds tests run systemd-creds under `unshare --map-root-user`; Ubuntu's AppArmor refuses that by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The test job's cache holds the same test build; saving one here would freeze whatever the first diff compiled.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: test-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          save-if: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.59.0,cargo-mutants@27.1.0,cargo-nextest@0.9.148
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch (all-zero `before`) or a force push leaves no usable base: diff the last commit.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            base=$(git merge-base "$BASE" HEAD)
          else
            base=HEAD^
          fi
          git diff "$base" HEAD > "$RUNNER_TEMP/changes.diff"
          just mutants --in-place --in-diff "$RUNNER_TEMP/changes.diff"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-diff
          path: |
            target/mutants/mutants.out/*.txt
            target/mutants-pkcs11/mutants.out/*.txt

  # The three packages from one nfpm file list, and the gate on their contents.
  package:
    name: just package
    # 26.04, because tss-esapi needs tss2-sys 4.1.3 and 24.04 has 4.0.1. Its glibc is newer than the ceiling
    # (packaging/glibc-ceiling.txt); `just glibc-ceiling` below fails a binary that needs more than 2.39.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tss-esapi builds against the TSS2 headers (libtss2-dev); tests and tools use a software TPM (swtpm, tpm2-tools).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: ${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.59.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm libarchive-tools zstd python3-yaml
      # Pinned release, checksum-verified; keep the version in step with mise.toml and harness/Containerfile.
      - run: |
          curl -sSfLo /tmp/nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  /tmp/nfpm.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - run: just package
      - name: just package-parity
        run: just package-parity
      - name: just glibc-ceiling
        run: just glibc-ceiling
      # ubuntu's apt cannot install Debian 13's lintian or Fedora's rpmlint: all three linters run in their distribution's container.
      - name: just package-lint
        run: just package-lint
        env:
          PACKAGE_LINT_FORCE_CONTAINER: "1"

  # The end-to-end tests: every target in a privileged systemd container with a software TPM (swtpm), and without one (none) on the targets with a
  # tpm-none marker (debian13), as in `just e2e`. A runner that cannot run such a
  # container fails the job (docker run --privileged is the first thing `just e2e` does): nothing here turns that into a pass.
  e2e:
    name: e2e ${{ matrix.target }} ${{ matrix.tpm }}
    # The packages are built here and installed on the targets: 24.04's glibc 2.39 is the ceiling (packaging/glibc-ceiling.txt).
    # 24.04 and not 26.04: on 26.04 the appid cases cannot find alice's app.slice in the docker guest.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [debian13, ubuntu2604, ubuntu2404, fedora44, alma10, arch]
        tpm: [swtpm]
        include:
          - target: debian13
            tpm: none
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      E2E_TPM: ${{ matrix.tpm }}
      E2E_ENGINE: docker
      TARGET: ${{ matrix.target }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tag v0.5.0 (M3) is built for the upgrade-m3-* cases (scripts/package-m3.sh)
      # tss-esapi builds against the TSS2 headers (libtss2-dev); tests and tools use a software TPM (swtpm, tpm2-tools).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev rpm libarchive-tools zstd python3-yaml
      # tss-esapi needs tss2-sys 4.1.3 and 24.04 has 4.0.1: build 4.1.3 into /usr/local, which pkg-config searches first.
      # Pinned release, checksum-verified (the SHA-512 in Fedora's sources file matches).
      - run: |
          sudo apt-get install -y --no-install-recommends libssl-dev
          curl -sSfLo /tmp/tss.tgz https://github.com/tpm2-software/tpm2-tss/releases/download/4.1.3/tpm2-tss-4.1.3.tar.gz
          echo "37f1580200ab78305d1fc872d89241aaee0c93cbe85bc559bf332737a60d3be8  /tmp/tss.tgz" | sha256sum -c -
          tar -xzf /tmp/tss.tgz -C /tmp
          cd /tmp/tpm2-tss-4.1.3
          ./configure --quiet --prefix=/usr/local --disable-fapi --disable-policy --disable-doxygen-doc --with-udevrulesdir=/tmp/udev
          make -s -j"$(nproc)"
          sudo make -s install
          sudo ldconfig
          [ "$(pkg-config --modversion tss2-sys)" = 4.1.3 ]
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: package-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          save-if: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.59.0
      # Pinned release, checksum-verified; keep the version in step with mise.toml and harness/Containerfile.
      - run: |
          curl -sSfLo /tmp/nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  /tmp/nfpm.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - run: just e2e "$TARGET"

  # Single required status check for branch protection: it fails if any job above did not succeed.
  ci:
    name: ci
    if: always()
    needs: [commits, lint, test, package, e2e, coverage, nightly, mutants]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # `skipped` is a main-only job on a PR.
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "job result: $r"; exit 1 ;; esac
          done
