name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A newer push cancels the older run, on main too: the newest commit contains the older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  commits:
    name: conventional commits
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: npm ci --no-audit --no-fund
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch (all-zero `before`) or a force push leaves no usable base: check the pushed commit.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            npx --no-install commitlint --from "$BASE" --to "$HEAD" --verbose
          else
            git log -1 --format=%B "$HEAD" | npx --no-install commitlint --verbose
          fi

  # A PR whose head commit is signed off as `ci` (`just signoff ci`, or `just release` after `just check-slow`)
  # does not run the jobs below again, but commitlint. Only someone with write access can sign off, so a fork PR
  # cannot. A milestone PR (a milestone/ branch of this repository; a fork's head repo differs) must be.
  signoff:
    name: signoff (ci)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      statuses: read
    outputs:
      signed: ${{ steps.check.outputs.signed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          MILESTONE: >-
            ${{ startsWith(github.head_ref, 'milestone/') &&
            github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # `just release` signs off after its push: give it a few minutes.
          tries=1
          [ "$MILESTONE" = true ] && tries=20
          for _ in $(seq "$tries"); do
            state=$(gh api "repos/$REPO/commits/$SHA/status" \
              --jq '[.statuses[] | select(.context == "signoff/ci")][0].state // ""')
            if [ "$state" = success ]; then echo signed=true >> "$GITHUB_OUTPUT"; exit 0; fi
            [ "$tries" = 1 ] || sleep 15
          done
          if [ "$MILESTONE" = true ]; then
            echo "::error::$SHA has no signoff/ci: run just release on the milestone branch"
            exit 1
          fi

  lint:
    name: just lint
    needs: [signoff]
    if: always() && needs.signoff.result != 'failure' && needs.signoff.outputs.signed != 'true'
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tss-esapi builds against the TSS2 headers (libtss2-dev); tests and tools use a software TPM (swtpm, tpm2-tools).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: ${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          # PR caches would evict main's, and main's are the ones every branch restores.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0,taplo@0.10.0,zizmor@1.31.1,shellcheck@0.11.0,cargo-deny@0.20.2,cargo-machete@0.9.2
      # install-action does not ship actionlint; pinned release, checksum-verified.
      - run: |
          curl -sSfLo /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C "$HOME/.cargo/bin" actionlint
      # The rest of `just check` (it needs the nfpm tools above); `just test` is its own job.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm libarchive-tools zstd python3-yaml
      - run: |
          curl -sSfLo /tmp/nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  /tmp/nfpm.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - run: just lint system-gates package-gate-test shell-scripts-test

  test:
    name: just test
    needs: [signoff]
    if: always() && needs.signoff.result != 'failure' && needs.signoff.outputs.signed != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tss-esapi builds against the TSS2 headers (libtss2-dev); tests and tools use a software TPM (swtpm, tpm2-tools).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev
      # The creds tests run systemd-creds under `unshare --map-root-user`; Ubuntu's AppArmor refuses that by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: ${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - run: just test

  # Unit and integration tests under llvm-cov, then the CRAP gate.
  coverage:
    name: just coverage-gate
    needs: [signoff]
    if: always() && needs.signoff.result != 'failure' && needs.signoff.outputs.signed != 'true'
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tss-esapi builds against the TSS2 headers (libtss2-dev); tests and tools use a software TPM (swtpm, tpm2-tools).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev
      # The creds tests run systemd-creds under `unshare --map-root-user`; Ubuntu's AppArmor refuses that by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: ${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0,cargo-llvm-cov@0.9.1
      - run: rustup component add llvm-tools-preview
      - run: just coverage-gate

  memory-safety:
    name: just memory-safety
    needs: [signoff]
    if: always() && needs.signoff.result != 'failure' && needs.signoff.outputs.signed != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tss-esapi builds against the TSS2 headers (libtss2-dev); tests and tools use a software TPM (swtpm, tpm2-tools).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0,cargo-fuzz@0.13.2
      - id: toolchain
        run: |
          toolchain=$(just --evaluate nightly_toolchain)
          rustup toolchain install "$toolchain" --profile minimal --component miri --component rust-src
          echo "nightly=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The pinned nightly and our own hash replace rust-cache's, which lists every toolchain on the runner image.
          shared-key: nightly-${{ steps.toolchain.outputs.nightly }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          add-rust-environment-hash-key: false
          workspaces: |
            . -> target
            crates/custodio-pkcs11/fuzz -> target
            crates/custodiod/fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just memory-safety

  # The three packages from one nfpm file list, and the gate on their contents.
  package:
    name: just package
    needs: [signoff]
    if: always() && needs.signoff.result != 'failure' && needs.signoff.outputs.signed != 'true'
    # 26.04, because tss-esapi needs tss2-sys 4.1.3 and 24.04 has 4.0.1. Its glibc is newer than the ceiling
    # (packaging/glibc-ceiling.txt); `just glibc-ceiling` below fails a binary that needs more than 2.39.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Debuginfo only slows compiling and linking here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tss-esapi builds against the TSS2 headers (libtss2-dev); tests and tools use a software TPM (swtpm, tpm2-tools).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Our own hash replaces rust-cache's, which lists every toolchain on the runner image and changes under us.
          add-rust-environment-hash-key: false
          shared-key: ${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm libarchive-tools zstd python3-yaml
      # Pinned release, checksum-verified; keep the version in step with mise.toml and harness/Containerfile.
      - run: |
          curl -sSfLo /tmp/nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  /tmp/nfpm.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - run: just package
      - name: just package-parity
        run: just package-parity
      - name: just glibc-ceiling
        run: just glibc-ceiling
      # ubuntu's apt cannot install Debian 13's lintian or Fedora's rpmlint: all three linters run in their distribution's container.
      - name: just package-lint
        run: just package-lint
        env:
          PACKAGE_LINT_FORCE_CONTAINER: "1"

  # A required status check (with e2e.yml's `e2e` and mutants-diff.yml's `just mutants (diff)`): it fails if any
  # job above did not succeed.
  ci:
    name: ci
    if: always()
    needs: [commits, signoff, lint, test, package, coverage, memory-safety]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # `skipped`: a job a signoff covers.
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "job result: $r"; exit 1 ;; esac
          done
