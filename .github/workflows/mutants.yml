name: Mutants

# Every mutant, in four shards, weekly and on each release tag. ci.yml only runs the ones on changed lines, so this catches a
# mutant that a test change let survive.
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  full:
    name: full (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No rust-cache: a tag-triggered workflow restoring a cache is a cache-poisoning path, and this runs rarely.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.59.0,cargo-mutants@27.1.0
      - env:
          SHARD: ${{ matrix.shard }}
        run: just mutants --in-place --shard "$SHARD/4"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.shard }}
          path: target/mutants/mutants.out/*.txt

  # One open issue collects every failing run, a comment each.
  report:
    needs: [full]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-*
          path: mutants
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          TITLE: Missed mutants
        run: |
          missed=$(find mutants -name missed.txt -exec cat {} + 2>/dev/null || true)
          {
            echo "Full sweep on \`$SHA\`: $RUN_URL"
            echo
            echo '```'
            echo "${missed:-no mutant list: see the run}"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$TITLE" --label bug --body-file "$RUNNER_TEMP/body.md"
          fi
