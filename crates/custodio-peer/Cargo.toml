[package]
name = "custodio-peer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Reads what the kernel says about the peer of a Unix socket: SO_PEERCRED, SO_PEERPIDFD, SO_PEERSEC"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dependencies]
libc = "0.2"
