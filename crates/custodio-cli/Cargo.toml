[package]
name = "custodio-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
custodiod = { path = "../custodiod", version = "0.1.0" }
rustix = { version = "1.1.6", features = ["termios", "fs"] }
secrecy = "0.10.3"
zbus = { version = "6", default-features = false, features = ["comms", "proxy", "default-rt"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
