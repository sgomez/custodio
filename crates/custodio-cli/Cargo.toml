[package]
name = "custodio-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
custodio-client = { path = "../custodio-client", version = "0.1.0" }
rustix = { version = "1.1.6", features = ["termios", "fs", "pty", "event", "pipe", "process"] }
secrecy = "0.10.3"
x509-cert = { version = "0.3.0", default-features = false }
zbus = { version = "6", default-features = false, features = ["comms", "proxy", "default-rt"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
