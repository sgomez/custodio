[package]
name = "custodio-pkcs11"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
cryptoki-sys = "0.5.0"
libc = "0.2.191"
pkcs1 = { version = "=0.8.0-rc.5", default-features = false, features = ["alloc"] }
x509-cert = { version = "0.3.0", default-features = false }
zbus = { version = "6", default-features = false, features = ["comms", "proxy", "default-rt"] }

[dev-dependencies]
cryptoki = "0.12.1"
custodiod = { path = "../custodiod", version = "0.1.0" }
tempfile = "3.27.0"
secrecy = "0.10.3"
zbus = { version = "6", default-features = false, features = [
  "comms",
  "proxy",
  "default-rt",
  "service",
] }
