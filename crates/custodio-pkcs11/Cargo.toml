[package]
name = "custodio-pkcs11"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
# Swaps the service for a fixed fake and exposes `fuzzing::run`; only for the fuzz target.
fuzzing = []

[dependencies]
custodio-client = { path = "../custodio-client", version = "0.1.0" }
cryptoki-sys = "0.5.0"
libc = "0.2.191"
pkcs1 = { version = "=0.8.0-rc.5", default-features = false, features = ["alloc"] }
sha2 = "0.11.1"
x509-cert = { version = "0.3.0", default-features = false }
zbus = { version = "6", default-features = false, features = ["comms", "proxy", "default-rt"] }

[dev-dependencies]
cryptoki = "0.12.1"
libloading = "0.9.0"
const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.3", features = ["alloc", "oid"] }
p256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8"] }
rsa = { version = "=0.10.0-rc.19", default-features = false, features = [
  "std",
  "encoding",
  "sha2",
] }
rand = "0.10.3"
spki = { version = "0.8.1", default-features = false, features = ["alloc"] }
tempfile = "3.27.0"
secrecy = "0.10.3"
zbus = { version = "6", default-features = false, features = [
  "comms",
  "proxy",
  "default-rt",
  "service",
] }
