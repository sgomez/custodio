[package]
name = "custodiod-fuzz"
version = "0.0.0"
edition = "2024"
license = "EUPL-1.2"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
custodiod = { path = ".." }
libfuzzer-sys = "0.4"
secrecy = "0.10.3"
arbitrary = { version = "1", features = ["derive"] }

[[bin]]
name = "p12_parse"
path = "fuzz_targets/p12_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dbus_args"
path = "fuzz_targets/dbus_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "delete_args"
path = "fuzz_targets/delete_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replace_cert_args"
path = "fuzz_targets/replace_cert_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "app_id"
path = "fuzz_targets/app_id.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tpm_blob"
path = "fuzz_targets/tpm_blob.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cred_frame"
path = "fuzz_targets/cred_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "record_decode"
path = "fuzz_targets/record_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tpm_sign_input"
path = "fuzz_targets/tpm_sign_input.rs"
test = false
doc = false
bench = false

# Keep out of the main workspace: fuzz targets need nightly and sanitizer flags.
[workspace]
