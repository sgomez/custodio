[package]
name = "custodiod-fuzz"
version = "0.0.0"
edition = "2024"
license = "EUPL-1.2"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
custodiod = { path = ".." }
libfuzzer-sys = "0.4"
secrecy = "0.10.3"

[[bin]]
name = "p12_parse"
path = "fuzz_targets/p12_parse.rs"
test = false
doc = false
bench = false

# Keep out of the main workspace: fuzz targets need nightly and sanitizer flags.
[workspace]
