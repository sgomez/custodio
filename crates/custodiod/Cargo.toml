[package]
name = "custodiod"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Cannot extend `workspace.lints`, so the workspace baseline (pedantic) is repeated here.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dependencies]
p12-keystore = "0.4.1"
p256 = { version = "0.14.0", default-features = false, features = [
  "arithmetic",
  "ecdsa",
  "pkcs8",
  "alloc",
] }
pkcs8 = { version = "0.11.0", default-features = false, features = ["alloc"] }
rand = "0.10.3"
rsa = { version = "=0.10.0-rc.19", default-features = false, features = [
  "std",
  "encoding",
  "sha2",
] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
sec1 = { version = "0.8.1", default-features = false, features = ["der"] }
secrecy = "0.10.3"
sha2 = "0.11.1"
x509-cert = { version = "0.3.0", default-features = false }
zbus = { version = "6", default-features = false, features = ["comms", "proxy", "default-rt"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
zbus = { version = "6", default-features = false, features = [
  "comms",
  "proxy",
  "default-rt",
  "service",
] }
