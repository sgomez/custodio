[package]
name = "custodiod"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Cannot extend `workspace.lints`, so the workspace baseline (pedantic) is repeated here.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
