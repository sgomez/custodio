[package]
name = "custodiod"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Custodio signing service"

# Cannot extend `workspace.lints`, so the workspace baseline (pedantic) is repeated here.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dependencies]
aes = { version = "0.9.3", features = ["zeroize"] }
hmac = { version = "0.13.0", features = ["zeroize"] }
custodio-client = { path = "../custodio-client", version = "0.1.0" }
p12-keystore = "0.4.1"
p256 = { version = "0.14.0", default-features = false, features = [
  "arithmetic",
  "ecdsa",
  "pkcs8",
  "alloc",
] }
pkcs8 = { version = "0.11.0", default-features = false, features = ["alloc"] }
rand = "0.10.3"
rsa = { version = "=0.10.0-rc.19", default-features = false, features = [
  "std",
  "encoding",
  "sha2",
] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
sec1 = { version = "0.8.1", default-features = false, features = ["der"] }
secrecy = "0.10.3"
sha2 = { version = "0.11.1", features = ["zeroize"] }
x509-cert = { version = "0.3.0", default-features = false }
zbus = { version = "6", default-features = false, features = [
  "comms",
  "proxy",
  "default-rt",
  "service",
] }
tss-esapi = { version = "=8.0.0-alpha.4", default-features = false }
zeroize = "1.9.1"

[dev-dependencies]
custodio-it = { path = "../custodio-it", version = "0.1.0" }
tempfile = "3.27.0"
