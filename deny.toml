# cargo-deny policy. Run with `cargo deny check` (part of `just check`).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

# Licences compatible with EUPL-1.2 (permissive, or weak copyleft listed as compatible in its
# appendix). Add to this list only after checking compatibility.
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "EUPL-1.2",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = [
  # Crypto goes through PKCS#11 and pure-Rust crates; no OpenSSL bindings.
  { crate = "openssl" },
  { crate = "openssl-sys" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
