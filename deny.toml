# cargo-deny policy. Run with `cargo deny check` (part of `just check`).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2023-0071 (Marvin, `rsa` timing side channel): no patched release exists. Accepted for
# RSA signing only because every signature needs an interactive polkit approval (seconds each, so
# the attacker cannot collect the thousands of timings the attack needs), the service passes an RNG
# so private-key operations are blinded, and a hostile same-uid process is out of scope in SPEC.md.
# Re-check when `rsa` publishes a fix; see docs/decisions.md (signing primitives).
#
# RUSTSEC-2024-0436 (`paste` is unmaintained, no vulnerability): a proc-macro crate that only runs at
# build time, pulled in by `tss-esapi` 8.0.0-alpha.4, which only `custodio-it` uses as a dev-dependency
# (the swtpm test fixture). Nothing from it ships in a binary. The 8.0 alpha is needed because 7.x
# cannot address swtpm on a Unix socket. Drop this entry when `tss-esapi` stops using `paste`.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2024-0436"]

# Licences compatible with EUPL-1.2 (permissive, or weak copyleft listed as compatible in its
# appendix). Add to this list only after checking compatibility.
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "EUPL-1.2",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = [
  # Crypto goes through PKCS#11 and pure-Rust crates; no OpenSSL bindings.
  { crate = "openssl" },
  { crate = "openssl-sys" },
]
skip = [
  # `tss-esapi` 8.0.0-alpha.4 (the TPM client, F112) pins getrandom 0.2; `rand` 0.10 (via p12-keystore
  # and the service) needs 0.4. No release of either lets them meet; both are small and audited.
  # Drop this entry when `tss-esapi` moves to getrandom 0.3 or later.
  { crate = "getrandom@0.2.17", reason = "pinned by tss-esapi 8.0.0-alpha.4; rand 0.10 needs 0.4" },
  # Two proc-macro generations in the build graph (displaydoc/thiserror-impl on syn 3, the asn1-rs
  # derives on syn 2) via p12-keystore. Build-time only; nothing from either ships in the binary.
  { crate = "syn@2.0.119", reason = "proc-macro only; pulled in by asn1-rs-derive via p12-keystore" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
